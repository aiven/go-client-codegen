name: Release

on:
  push:
    branches: [main]
    paths: [version.go]

permissions: read-all

jobs:
  # Fires when `main` advances with a `version.go` change (i.e. the queue just
  # merged a `chore(update): …` PR produced by `.github/workflows/update.yml`,
  # which bumps `version.go` in the same commit as the generated code). Parses
  # the version out of `version.go`, creates the tag, and publishes the GitHub
  # Release. Idempotent: skips if the tag already exists.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Read version from `version.go`
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*func Version() string { return "\(v[0-9][^"]*\)".*/\1/p' version.go | head -n1)"
          if [[ -z "$version" ]]; then
            echo "::error::could not parse version from version.go"
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: auto-generated release for commit ${{ github.sha }}
