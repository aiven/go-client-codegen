name: Release

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "!**_test.go"
      - "!generator/**"
  workflow_dispatch: {}

permissions: read-all

jobs:
  # Fires when the merge queue lands library Go changes on `main` (tests and
  # `generator/` alone don't count), or manually. Tags the pushed commit with
  # the next minor version and publishes a GitHub Release with the current
  # patched `openapi.json` attached as `openapi.zip`; fails if that spec
  # generates different handlers than committed. Nothing is committed back:
  # `Version()` reads the tag from build info.
  # Idempotent: skips if the commit is already tagged.
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          existing="$(git tag --points-at HEAD --list 'v*' | head -n1)"
          if [[ -n "$existing" ]]; then
            echo "commit already tagged as $existing; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          : "${current:=v0.0.0}"
          IFS='.' read -r major minor _ <<< "${current#v}"
          tag="v${major}.$((minor + 1)).0"
          echo "next version: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.version.outputs.skip == 'false'
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v3
        if: steps.version.outputs.skip == 'false'

      # Downloaded before tagging, so a failed fetch or a spec that no longer
      # matches the committed code leaves no tag behind.
      # The generator writes the patched spec back to `openapi.json`.
      - name: Download, patch and zip OpenAPI spec
        if: steps.version.outputs.skip == 'false'
        run: |
          set -euo pipefail
          task download-spec
          task generate-client
          # Only `handler/`: other generated files need `goimports` and `mockery`.
          # Handlers import only the standard library, so they skip formatting.
          if [[ -n "$(git status --porcelain -- handler)" ]]; then
            git status --short -- handler
            echo "::error::the current spec generates different code; merge the latest schema update first"
            exit 1
          fi
          zip -9 -j -X openapi.zip openapi.json

      - name: Create and push tag
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: auto-generated release for commit ${{ github.sha }}
          files: openapi.zip
          fail_on_unmatched_files: true
