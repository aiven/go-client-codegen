name: Update

on:
  schedule:
    - cron: 0 3 * * 1-5
  workflow_dispatch: {}

permissions: read-all

jobs:
  updater:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/tools/cmd/goimports@latest
      - run: go install github.com/vektra/mockery/v3@v3.5.5
      - uses: arduino/setup-task@v3
      - run: task generate
        env:
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
          AIVEN_PROJECT_NAME: ${{ secrets.AIVEN_PROJECT_NAME }}
      # Bump `version.go` in the same commit the update PR will carry, but
      # only when `task generate` actually produced a diff. Without this
      # guard, no-op runs (schema unchanged) still open a PR that only
      # moves the version forward.
      #
      # `release.yml` keys off `version.go` changing on `main`, so writing
      # `version.go` here is what triggers the tag + GitHub Release when
      # the PR eventually merges.
      - name: Bump `version.go`
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- ':(exclude)version.go' ':(exclude)openapi.json')" ]]; then
            echo "task generate produced no changes; skipping version bump"
            exit 0
          fi
          git fetch --tags --force --quiet
          current="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          : "${current:=v0.0.0}"
          IFS='.' read -r major minor patch <<< "${current#v}"
          minor=$((minor + 1))
          patch=0
          next="v${major}.${minor}.${patch}"
          openapi_hash="$(sha256sum openapi.json | awk '{print $1}')"
          echo "next version: $next"
          echo "openapi SHA-256: $openapi_hash"
          cat > version.go <<EOF
          package aiven

          // Version returns aiven-go-client version string
          func Version() string { return "$next" }

          // OpenAPISpecHash returns the SHA-256 hex digest of the OpenAPI document for this release
          func OpenAPISpecHash() string {
          	return "$openapi_hash"
          }
          EOF
      - id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          author: GitHub <noreply@github.com>
          body: >
            automated changes by
            [update](https://github.com/aiven/go-client-codegen/blob/main/.github/workflows/update.yml)
            GitHub Actions workflow
          branch: update/${{ steps.date.outputs.date }}-${{ github.run_id }}
          commit-message: "chore(update): bump openapi schema (${{ steps.date.outputs.date }})"
          title: "chore(update): bump openapi schema (${{ steps.date.outputs.date }})"
          labels: |
            schema bump
            automated pr
      - name: Close previous update PRs
        if: steps.create_pr.outputs.pull-request-operation == 'created'
        run: |
          new_pr_number=${{ steps.create_pr.outputs.pull-request-number }}
          prs=$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("update/")) | .number')
          for pr in $prs; do
            if [ "$pr" != "$new_pr_number" ]; then
              gh pr close $pr --comment "Auto-closing pull request in favor of #$new_pr_number" --delete-branch
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
